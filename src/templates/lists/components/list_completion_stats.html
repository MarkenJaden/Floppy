{% load i18n %}
<span id="list-completion-stats" class="inline-flex items-center" {% if oob %}hx-swap-oob="outerHTML"{% endif %}>
  {% if completion_percent is not None %}
    <span class="mx-2 text-gray-600">•</span>
    <div class="relative inline-flex"
         x-data="{ tooltipOpen: false }"
         @click.outside="tooltipOpen = false">
      <button type="button"
              class="cursor-pointer hover:text-[var(--color-text-secondary)] transition-colors"
              @mouseenter="tooltipOpen = true"
              @mouseleave="tooltipOpen = false"
              @click="tooltipOpen = !tooltipOpen"
              aria-label="{% translate "Show completion details" %}">
        <span class="sm:hidden">{% blocktranslate trimmed with value_1=completion_percent %}{{ value_1 }}% done{% endblocktranslate %}</span>
        <span class="hidden sm:inline">{% blocktranslate trimmed with value_1=completion_percent %}{{ value_1 }}% complete{% endblocktranslate %}</span>
      </button>
      <div x-show="tooltipOpen"
           x-cloak
           x-transition:enter="transition ease-out duration-200"
           x-transition:enter-start="opacity-0 scale-95"
           x-transition:enter-end="opacity-100 scale-100"
           x-transition:leave="transition ease-in duration-150"
           x-transition:leave-start="opacity-100 scale-100"
           x-transition:leave-end="opacity-0 scale-95"
           class="absolute left-1/2 bottom-full z-10 mb-2 w-64 max-w-[calc(100vw-2rem)] -translate-x-1/2 rounded-lg p-3 text-center text-xs text-[var(--color-text)]"
           style="display: none; background: rgba(0, 0, 0, 1); box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);">
        {% blocktranslate trimmed with value_1=completed_count value_2=items_count %}{{ value_1 }}/{{ value_2 }} completed{% endblocktranslate %}
        <div class="absolute left-1/2 top-full h-0 w-0 -translate-x-1/2 border-l-4 border-r-4 border-t-4 border-transparent" style="border-top-color: rgba(0, 0, 0, 1);"></div>
      </div>
    </div>
  {% endif %}
</span>
