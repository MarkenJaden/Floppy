name: Upstream Sync (dannyvfilms/Floppy -> Floppy)

on:
  schedule:
    # Run every 3 hours
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: 'Upstream repository (owner/repo)'
        required: false
        default: 'dannyvfilms/Floppy'
      upstream_branch:
        description: 'Upstream branch to sync from'
        required: false
        default: 'latest'
      target_branch:
        description: 'Target branch to update in this repo'
        required: false
        default: 'latest'
      dry_run:
        description: 'Validate merge and checks without pushing or opening PRs/issues'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  sync:
    uses: MarkenJaden/workflows/.github/workflows/upstream-sync.yml@main
    with:
      upstream_repo: ${{ inputs.upstream_repo || 'dannyvfilms/Floppy' }}
      upstream_branch: ${{ inputs.upstream_branch || 'latest' }}
      target_branch: ${{ inputs.target_branch || 'latest' }}
      python_version: '3.12'
      submodules: 'false'
      workflow_sync_policy: 'preserve_if_no_pat'
      post_merge_workflow: 'docker-image.yml'
      dry_run: ${{ inputs.dry_run || false }}
      preflight_command: |
        UV_REQ=$(python3 -c '
        import pathlib, re
        txt = pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
        m = re.search(r"required-version\s*=\s*\"([^\"]+)\"", txt)
        print(m.group(1) if m else "")
        ')
        python3 -m pip install --quiet "uv${UV_REQ}"
        uv sync --locked --all-packages --all-extras
        LAST_MSG=$(git log -1 --pretty=%s || true)
        if [[ "$LAST_MSG" == merge:\ auto-resolve* || "$LAST_MSG" == chore\(sync\):\ auto-resolve* ]]; then
          CHANGED_PY=$(git diff --name-only HEAD~1 HEAD -- '*.py' || true)
          if [ -n "$CHANGED_PY" ]; then
            echo "$CHANGED_PY" | xargs -r uv run --no-sync ruff check --fix || true
            echo "$CHANGED_PY" | xargs -r uv run --no-sync ruff format || true
          fi
          if [ -n "$(git status --porcelain)" ]; then
            git commit -am "style: format auto-resolved conflicts with ruff" || true
          fi
        fi
        uv run --no-sync ruff check src
        if [ -d mcp_server ]; then
          uv run --no-sync ruff check mcp_server
        fi
        SECRET=ci-preflight-only uv run --no-sync python src/manage.py check_migration_hygiene --strict --base-ref "upstream/${UPSTREAM_BRANCH:-latest}"
      test_command: |
        export SECRET="$(uv run --no-sync python -c 'import secrets; print(secrets.token_urlsafe(50))')"
        set +e
        uv run --no-sync python src/manage.py test \
          app users lists events integrations api config \
          --parallel --buffer --exclude-tag network --exclude-tag slow 2>&1 | tee /tmp/test_run.log
        TEST_EXIT=${PIPESTATUS[0]}
        set -e
        if [ "$TEST_EXIT" -ne 0 ]; then
          if [ -f .github/scripts/gemini_test_evaluator.py ] && python3 .github/scripts/gemini_test_evaluator.py /tmp/test_run.log; then
            uv run --no-sync ruff check src
          else
            exit "$TEST_EXIT"
          fi
        fi
        if [ -d mcp_server/tests ]; then
          uv run --no-sync python -m pytest -c mcp_server/pyproject.toml mcp_server/tests -q
        fi
    secrets: inherit
